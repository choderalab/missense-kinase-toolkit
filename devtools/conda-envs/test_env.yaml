name: test
channels:

  - conda-forge

  - defaults
dependencies:
    # Base depends
  - python >=3.10,<3.12
  - pip

    # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - filelock
  - codecov

    # databases
    # TODO: pinned to match mkt-databases' pandas>=2,<3. the suite passes on pandas 3, but
    # before lifting the pin confirm regenerated artifacts (e.g., KinaseInfo.tar.gz) are
    # byte-identical on pandas 3
  - pandas<3
  - xlrd
  - bravado
  - requests-cache
  - beautifulsoup4
  - numpy
  - biopython
  - pymol-open-source
  - matplotlib
  - bokeh
  - seaborn
  - matplotlib-venn
  - scipy
  - scikit-learn
  - omegaconf
  - typer
  - pydantic
  - GitPython
  - importlib-resources

    # schema
  - gitpython
  - pydantic
  - strenum
  - toml
  - pyyaml
  - tqdm

  - pip:
    - git+https://github.com/tansey-lab/nf-rnaseq
