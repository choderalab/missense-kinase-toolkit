name: databases-ci

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "main"
    paths:
      - "missense_kinase_toolkit/databases/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "missense_kinase_toolkit/databases/**"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

# cancel superseded in-progress runs for the same ref (e.g. rapid PR pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      # retired micromamba setup, kept for reference (the env file is still used for local dev);
      # to restore, uncomment and switch the steps below back to `shell: bash -l {0}` with
      # `pip install --no-deps` of schema + databases
      # - uses: mamba-org/setup-micromamba@v1
      #   with:
      #     environment-file: devtools/conda-envs/test_env.yaml
      #     environment-name: test
      #     channels: conda-forge,defaults
      #     create-args: >-
      #       python=${{ matrix.python-version }}
      #     cache-environment: true

      - name: Install uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          # re-key the uv cache only when declared deps change
          cache-dependency-glob: "missense_kinase_toolkit/*/pyproject.toml"

      - name: Install package
        # deps come from the sub-packages' pyproject.toml; pymol (for SASA tests) is not a
        # declared dep, and PyPI's `pymol-open-source-whl` stands in for conda's pymol-open-source
        shell: bash
        run: |
          # the pymol wheel crashes on Windows at session start (UnicodeDecodeError in
          # pymol2.PyMOL()), so skip it there; the pymol SASA test then importorskips
          pymol_pkg="pymol-open-source-whl"
          if [ "$RUNNER_OS" = "Windows" ]; then pymol_pkg=""; fi
          uv pip install \
            ./missense_kinase_toolkit/schema \
            "./missense_kinase_toolkit/databases[test]" \
            $pymol_pkg
          uv pip list

      - name: Run tests
        shell: bash
        run: |
          # run each package test suite; append to coverage file
          # exit immediately if a command exits with a non-zero status
          set -e
          pytest \
            -v \
            -n 2 \
            --dist loadfile \
            --durations=20 \
            --cov-report=xml \
            --color=yes  \
            --cov=mkt.databases \
            missense_kinase_toolkit/databases/mkt/databases/tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false # optional (default = false)
          file: ./coverage.xml
          flags: databases # optional
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          # https://github.com/codecov/codecov-action
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
