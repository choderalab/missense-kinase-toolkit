name: schema-ci

on:
  push:
    branches:
      - "main"
    paths:
      - "missense_kinase_toolkit/schema/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "missense_kinase_toolkit/schema/**"
  schedule:
    - cron: "0 0 * * 0"

# cancel superseded in-progress runs for the same ref (e.g. rapid PR pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      # retired micromamba setup, kept for reference (the env file is still used for local dev);
      # to restore, uncomment and switch the steps below back to `shell: bash -l {0}` with
      # `pip install -e --no-deps` of schema
      # - uses: mamba-org/setup-micromamba@v1
      #   with:
      #     micromamba-version: '1.5.10-0'
      #     environment-file: devtools/conda-envs/test_env.yaml
      #     environment-name: schema_test
      #     create-args: >-
      #       python=${{ matrix.python-version }}
      #     cache-environment: true

      - name: Install uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          # re-key the uv cache only when declared deps change
          cache-dependency-glob: "missense_kinase_toolkit/schema/pyproject.toml"

      - name: Install package
        # only schema's own deps -- the old env file pulled in the full databases stack
        shell: bash
        run: |
          uv pip install -e "./missense_kinase_toolkit/schema[test]"
          uv pip list

      - name: Run tests
        shell: bash
        run: |
          set -e
          pytest \
            -v \
            -n 2 \
            --dist loadfile \
            --durations=20 \
            --cov-report=xml \
            --color=yes  \
            --cov=mkt.schema \
            missense_kinase_toolkit/schema/mkt/schema/tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false # optional (default = false)
          file: ./coverage.xml
          flags: schema # optional
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
